version: '3'

services:
  op-db:
    image: postgres:14-alpine
    restart: always
    volumes:
      - ./docker/data/op-db-data:/var/lib/postgresql/data
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  op-kv:
    image: redis:7.2.5-alpine
    restart: always
    volumes:
      - ./docker/data/op-kv-data:/data
    command: [ 'redis-server', '--maxmemory-policy', 'noeviction' ]
    ports:
      - 6379:6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  op-geo:
    image: observabilitystack/geoip-api:latest
    restart: always
    ports:
      - 8082:8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  op-ch:
    image: clickhouse/clickhouse-server:24.12.2.29-alpine
    restart: always
    volumes:
      - ./docker/data/op-ch-data:/var/lib/clickhouse
      - ./docker/data/op-ch-logs:/var/log/clickhouse-server
      - ./self-hosting/clickhouse/clickhouse-config.xml:/etc/clickhouse-server/config.d/op-config.xml
      - ./self-hosting/clickhouse/clickhouse-user-config.xml:/etc/clickhouse-server/users.d/op-user-config.xml
      - ./self-hosting/clickhouse/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    ports:
      - "8123:8123" # HTTP interface
      - "9000:9000" # Native/TCP interface
      - "9009:9009" # Inter-server communication
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  op-api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        NODE_VERSION: "22.15.0"
        DATABASE_URL: postgresql://postgres:postgres@op-db:5432/openpanel
        CACHE_BUST: ${CACHE_BUST:-1}
    restart: unless-stopped
    ports:
      - "3001:3000"
    depends_on:
      op-db:
        condition: service_healthy
      op-kv:
        condition: service_healthy
      op-ch:
        condition: service_healthy
      op-geo:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@op-db:5432/openpanel
      - DATABASE_URL_DIRECT=postgresql://postgres:postgres@op-db:5432/openpanel
      - REDIS_URL=redis://op-kv:6379
      - CLICKHOUSE_URL=http://op-ch:8123
      - GEOIP_URL=http://op-geo:8082
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:3001
      - NEXT_PUBLIC_DASHBOARD_URL=http://localhost:3000
      - DISABLE_HEALTHCHECK=1
      - SELF_HOSTED=1
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - openpanel-network
  op-dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
      args:
        DATABASE_URL: postgresql://postgres:postgres@op-db:5432/openpanel
        CACHE_BUST: ${CACHE_BUST:-1}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      op-api:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@op-db:5432/openpanel
      - DATABASE_URL_DIRECT=postgresql://postgres:postgres@op-db:5432/openpanel
      - REDIS_URL=redis://op-kv:6379
      - CLICKHOUSE_URL=http://op-ch:8123
      - NEXT_PUBLIC_DASHBOARD_URL=http://localhost:3000
      - NEXT_PUBLIC_API_URL=http://localhost:3001
      - NODE_ENV=production
      - SKIP_ENV_VALIDATION=1
      - NEXT_TELEMETRY_DISABLED=1
    env_file:
      - .env
    networks:
      - openpanel-network

  op-worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
      args:
        NODE_VERSION: "22.15.0"
        DATABASE_URL: postgresql://postgres:postgres@op-db:5432/openpanel
        CACHE_BUST: ${CACHE_BUST:-1}
    restart: unless-stopped
    depends_on:
      op-api:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@op-db:5432/openpanel
      - DATABASE_URL_DIRECT=postgresql://postgres:postgres@op-db:5432/openpanel
      - REDIS_URL=redis://op-kv:6379
      - CLICKHOUSE_URL=http://op-ch:8123
      - GEOIP_URL=http://op-geo:8082
      - NODE_ENV=production
    env_file:
      - .env
    deploy:
      replicas: 2
    networks:
      - openpanel-network

  op-public:
    build:
      context: .
      dockerfile: apps/public/Dockerfile
      args:
        NODE_VERSION: "22.15.0"
        DATABASE_URL: postgresql://postgres:postgres@op-db:5432/openpanel
        REDIS_URL: redis://op-kv:6379
        CLICKHOUSE_URL: http://op-ch:8123
        CACHE_BUST: ${CACHE_BUST:-1}
    ports:
      - "3002:3000"
    depends_on:
      op-api:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@op-db:5432/openpanel
      - REDIS_URL=redis://op-kv:6379
      - CLICKHOUSE_URL=http://op-ch:8123
      - NODE_ENV=production
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - openpanel-network

  op-docs:
    build:
      context: .
      dockerfile: apps/docs/Dockerfile
      args:
        CACHE_BUST: ${CACHE_BUST:-1}
    restart: unless-stopped
    ports:
      - "3003:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - openpanel-network

networks:
  openpanel-network:
    driver: bridge 
