version: '3'

services:
  caddy:
    image: caddy:2-alpine
    build:
      context: .
      dockerfile: caddy.Dockerfile
    container_name: caddy
    ports:
      - "30000:80"
    env_file:
      - .env
    volumes:
      - ./caddy.Caddyfile.template:/Caddyfile.template:ro
      - ./caddy.entrypoint.sh:/entrypoint.sh:ro
      - op-proxy-data:/data
      - op-proxy-config:/config
    entrypoint: [ "/bin/sh", "/entrypoint.sh" ]
    depends_on:
      - op-api
      - op-dashboard
      - op-worker
    networks:
      openpanel-network:
        aliases:
          - example.localhost
          - www.example.localhost
  op-db:
    image: postgres:14-alpine
    restart: always
    volumes:
      - op-db-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - openpanel-network

  op-kv:
    image: redis:7.2.5-alpine
    restart: always
    volumes:
      - op-kv-data:/data
    command: [ 'redis-server', '--maxmemory-policy', 'noeviction' ]
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - openpanel-network

  op-geo:
    image: observabilitystack/geoip-api:latest
    restart: always
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - openpanel-network

  op-ch:
    image: clickhouse/clickhouse-server:24.12.2.29-alpine
    restart: always
    volumes:
      - op-ch-data:/var/lib/clickhouse
      - op-ch-logs:/var/log/clickhouse-server
      - ./self-hosting/clickhouse/clickhouse-config.xml:/etc/clickhouse-server/config.d/op-config.xml
      - ./self-hosting/clickhouse/clickhouse-user-config.xml:/etc/clickhouse-server/users.d/op-user-config.xml
      - ./self-hosting/clickhouse/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: [ "CMD", "clickhouse-client", "--query", "SELECT 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - openpanel-network

  op-api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        NODE_VERSION: "22.15.0"
        DATABASE_URL: postgresql://postgres:postgres@op-db:5432/openpanel
        CACHE_BUST: ${CACHE_BUST:-1}
    restart: unless-stopped
    depends_on:
      op-db:
        condition: service_healthy
      op-kv:
        condition: service_healthy
      op-ch:
        condition: service_healthy
      op-geo:
        condition: service_healthy
    command: >
      sh -c "
        echo 'Waiting for PostgreSQL to be ready...'
        while ! nc -z op-db 5432; do
          sleep 1
        done
        echo 'PostgreSQL is ready'

        echo 'Waiting for ClickHouse to be ready...'
        while ! nc -z op-ch 8123; do
          sleep 1
        done
        echo 'ClickHouse is ready'

        echo 'Running migrations...'
        CI=true pnpm -r run migrate:deploy

        pnpm start
      "
    env_file:
      - .env
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/healthcheck" ]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - openpanel-network
  op-dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
      args:
        DATABASE_URL: postgresql://postgres:postgres@op-db:5432/openpanel
        CACHE_BUST: ${CACHE_BUST:-1}
    restart: unless-stopped
    entrypoint: /app/entrypoint.sh node /app/apps/dashboard/server.js
    depends_on:
      op-api:
        condition: service_healthy
    env_file:
      - .env
    networks:
      - openpanel-network

  op-worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
      args:
        NODE_VERSION: "22.15.0"
        DATABASE_URL: postgresql://postgres:postgres@op-db:5432/openpanel
        CACHE_BUST: ${CACHE_BUST:-1}
    restart: unless-stopped
    depends_on:
      op-api:
        condition: service_healthy
    env_file:
      - .env
    deploy:
      replicas: 2
    networks:
      - openpanel-network

  op-public:
    build:
      context: .
      dockerfile: apps/public/Dockerfile
      args:
        NODE_VERSION: "22.15.0"
        DATABASE_URL: postgresql://postgres:postgres@op-db:5432/openpanel
        REDIS_URL: redis://op-kv:6379
        CLICKHOUSE_URL: http://op-ch:8123
        CACHE_BUST: ${CACHE_BUST:-1}
    depends_on:
      op-api:
        condition: service_healthy
    env_file:
      - .env
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/" ]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - openpanel-network

  op-docs:
    build:
      context: .
      dockerfile: apps/docs/Dockerfile
      args:
        CACHE_BUST: ${CACHE_BUST:-1}
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/" ]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - openpanel-network

networks:
  openpanel-network:
    driver: bridge

volumes:
  op-db-data:
    driver: local
  op-kv-data:
    driver: local
  op-ch-data:
    driver: local
  op-ch-logs:
    driver: local
  op-proxy-data:
    driver: local
  op-proxy-config:
    driver: local
